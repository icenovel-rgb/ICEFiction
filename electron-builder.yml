appId: com.icenovel.icefiction
productName: ICEFiction
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - icon.png
win:
  target: nsis
  icon: build/icon.png
mac:
  target: dmg
  icon: build/icon.png
  category: public.app-category.productivity
  # 조건부 서명: 인증서(CSC_LINK)나 키체인 신원이 있으면 서명하고, 없으면 자동으로 건너뛴다.
  #  · 무서명으로 강제하려면 CSC_IDENTITY_AUTO_DISCOVERY=false (CI의 검증·PR 빌드가 그렇게 한다).
  #  · 공증(notarize)은 여기서 켜지 않는다 — 릴리스 경로에서 `-c.mac.notarize=true`로만 켠다
  #    (자격증명 없이 무조건 공증하면 실패하므로).
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}.${ext}
dmg:
  # dmg 껍데기 자체도 서명한다. electron-builder의 공증(mac.notarize)은 .app만 대상이라,
  # 이걸 켜지 않으면 앱은 공증돼도 dmg는 무서명으로 남아 `spctl -t open`이 거부한다
  # (source=no usable signature). 서명 뒤 dmg 공증·stapling은 CI의 별도 스텝이 맡는다.
  sign: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 바탕화면 바로가기는 build/installer.nsh의 체크박스 페이지에서 사용자 선택으로 생성.
  createDesktopShortcut: false
  artifactName: ${productName}-Setup-${version}.${ext}
